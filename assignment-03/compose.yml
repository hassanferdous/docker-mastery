# Services
services:
    # API
    api:
        build:
            context: ./api
        expose:
            - '8000'
        environment:
            - PORT=8000
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/assignment03
            - REDIS_URL=redis://redis:6379
        networks:
            - app-network
            - frontend-network
        volumes:
            - ./api:/app
            - /app/node_modules
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # DATABASE
    db:
        image: postgres:17
        restart: unless-stopped
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=assignment03
        expose:
            - '5432'
        volumes:
            - ./postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 5
    #REDIS
    redis:
        image: redis:7
        restart: unless-stopped
        expose:
            - '6379'
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli ping']
            interval: 5s
            timeout: 5s
            retries: 5

    # NGINX REVERSE PROXY
    nginx:
        image: nginx:latest
        ports:
            - '3000:80'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - frontend-network
        depends_on:
            - api
            - web
        restart: unless-stopped

    # WEB
    web:
        build:
            context: ./web
        expose:
            - '3000'
        environment:
            - API_URL=http://api:8000
        networks:
            - frontend-network

        depends_on:
            - api

networks:
    frontend-network:
    app-network:
        driver: bridge
        internal: true
