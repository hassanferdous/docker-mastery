
services:
    backend:
        build: .
        environment:
            - DB_URI=postgresql://user:password@db:5432/challenge-db
        networks:
            - backend
            - frontend
        healthcheck:
            test:
                ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 5
        depends_on:
            db:
                condition: service_healthy
    db:
        image: postgres:15
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: challenge-db
        networks:
            - backend
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d challenge-db']
            interval: 5s
            timeout: 3s
            retries: 5
    frontend:
        image: nginx:stable
        ports:
            - '3000:80'
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - frontend
        depends_on:
            - backend

networks:
    backend:
        driver: bridge
    frontend:
        driver: bridge
volumes:
    postgres_data:
